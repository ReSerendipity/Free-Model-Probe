version: 2
updates:
  # GitHub Actions 版本更新（本仓仅使用 actions/checkout、actions/setup-python）
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    labels: [dependencies, ci]

  # 本仓脚本仅依赖 Python 标准库，无 requirements.txt；如后续引入依赖，
  # 取消下面 pip 条目的注释并指定依赖文件所在目录。
  # - package-ecosystem: pip
  #   directory: "/"
  #   schedule: { interval: monthly }
  #   open-pull-requests-limit: 5
  #   labels: [dependencies]
